[server]
MLFLOW_S3_ENDPOINT_URL = http://<mlflow_server>:8002
MLFLOW_TRACKING_URI = http://<mlflow_server>:85
ARTIFACT_PATH = s3://mlflow

[project]
NAME = <project_name>  # e.g. BrainSegTemplate

[system]
USE_GPU = True
CUDA_VISIBLE_DEVICES = 0   # change if multi-GPU

[xnat]
SERVER = http://<xnat_server>:80
USER = <xnat_username>
PASSWORD = <xnat_password>
PROJECT = <xnat_project>
VERIFY = false

[data]
REGIONS_JSON_PATH = <path_to_regions.json>
TRAIN_FRACTION = 0.9
TEST_FRACTION = 0.1

[tmp_dirs]
OS_TMP_DIR = /tmp
TMP_WORKING_DIR = nnunet_tmp

[nnunet]
NNUNET_RAW_DIR = nnUNet_raw
NNUNET_RESULTS_DIR = nnUNet_results
NNUNET_PREPROCESSED_DIR = nnUNet_preprocessed

# NNUNET_UNET_CONFIGURATION
# Options: 3d_fullres, 3d_cascade_fullres, 3d_lowres, or 2d
NNUNET_UNET_CONFIGURATION = 3d_fullres

# NNUNET_FOLD
# Specify folds for cross-validation, e.g. [0,1,2,3,4]
NNUNET_FOLD = [0]

# NNUNET_TRAINER
# Default: nnUNetTrainer (1000 epochs)
# Options: nnUNetTrainer_1epoch, nnUNetTrainer_20epochs, etc.
NNUNET_TRAINER = nnUNetTrainer

# NNUNET_DEVICE
# Options: mps (Apple M1/M2), cuda (GPU), cpu
NNUNET_DEVICE = cuda

# NNUNET_NUM_GPUS
# Must match CUDA_VISIBLE_DEVICES list length
NNUNET_NUM_GPUS = 1

# NNUNET_NPZ
# For ensembling: --npz
NNUNET_NPZ = --npz
