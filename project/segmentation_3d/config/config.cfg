[server]
MLFLOW_S3_ENDPOINT_URL = http://<remote server address>:8002
MLFLOW_TRACKING_URI = http://<remote server address>:85
ARTIFACT_PATH = s3://mlflow

[system]
# Used only when NNUNET_DEVICE = cuda. Set this explicitly to the reserved DGX GPU ids.
# Multi-GPU training is inferred from the number of ids listed here.
CUDA_VISIBLE_DEVICES = 0
# Seed for the reproducible train/test split.
RANDOM_SEED = 42
# Max worker threads for parallel XNAT data fetching (capped at the CPU count at runtime).
MAX_WORKERS = 32

[xnat]
SERVER = http://<remote XNAT server address>:80
USER =
PASSWORD =
PROJECT =
VERIFY = false

[project]
NAME =

[data]
# Path to the regions.json describing the image + contour files to train on.
REGIONS_JSON_PATH = # e.g. regions/PROJECT/regions.json
TRAIN_FRACTION = 0.8
TEST_FRACTION = 0.2

[tmp_dirs]
OS_TMP_DIR = /tmp
TMP_WORKING_DIR = nnunet_tmp

[nnunet]
NNUNET_RAW_DIR = nnUNet_raw
NNUNET_RESULTS_DIR = nnUNet_results
NNUNET_PREPROCESSED_DIR = nnUNet_preprocessed

# NNUNET_UNET_CONFIGURATION
# 3d_fullres, 3d_cascade_fullres, 3d_lowres or 2d
NNUNET_UNET_CONFIGURATION = 3d_fullres

# NNUNET_FOLD
# Important: JSON list of ints, max range(5), e.g.: [0,1,2,3,4] for 5-fold cross-validation
NNUNET_FOLD = [0]

# NNUNET_TRAINER
# Default: nnUNetTrainer (1000 epochs)
# With no mirroring: nnUNetTrainerNoMirroring (1000 epochs)
# Testing: nnUNetTrainer_1epoch, nnUNetTrainer_20epochs, etc.
# All the options -> https://github.com/MIC-DKFZ/nnUNet/tree/master/nnunetv2/training/nnUNetTrainer/variants 
NNUNET_TRAINER = nnUNetTrainerNoMirroring

# Plans identifier passed to nnU-Net's -p flag
NNUNET_PLANS_IDENTIFIER = nnUNetPlans

# Experiment planner. Legacy = ExperimentPlanner, ResEnc = nnUNetPlannerResEnc{M,L,XL}
NNUNET_PLANNER = ExperimentPlanner

# NNUNET_DEVICE
# mps = Apple M1/M2, cuda = GPU, cpu = CPU
NNUNET_DEVICE = cuda

# Target GPU memory in GB for nnU-Net (controls batch / patch size). Leave blank for default.
# Always leave blank on first experiment(s) (see https://github.com/MIC-DKFZ/nnUNet/blob/master/nnunetv2/experiment_planning/plan_and_preprocess_entrypoints.py)
NNUNET_GPU_MEMORY_TARGET =

# NNUNET_NPZ
# True enables npz export for best-configuration search and postprocessing.
NNUNET_NPZ = True
