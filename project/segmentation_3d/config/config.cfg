[server]
MLFLOW_S3_ENDPOINT_URL = http://<remote server address>:8002
MLFLOW_TRACKING_URI = http://<remote server address>:85
ARTIFACT_PATH = s3://mlflow

[system]
# Used only when NNUNET_DEVICE = cuda
CUDA_VISIBLE_DEVICES = 0
RANDOM_SEED = 42
# number of workers for parallel XNAT data fetching
XNAT_DOWNLOAD_NUM_WORKERS = 32
# per-run working folder (timestamp + uuid appended). All data, nnU-Net processing and models
# go there. Under csc-mlops this folder is inside the docker container, so it physically lives
# on the disk backing Docker's root dir (check: docker info | grep "Docker Root Dir").
# Make sure that is a fast drive with enough storage.
TMP_WORKING_DIR = /tmp/nnunet_tmp

[xnat]
SERVER = http://<remote XNAT server address>:80
USER =
PASSWORD =
PROJECT =
VERIFY = false

[project]
# Read by csc-mlops. Lowercased and used as the MLflow
# experiment name, the docker image name, and the MLproject name.
NAME =

[data]
# Path to the regions.json describing the image + contour files to train on.
# e.g. regions/PROJECT/regions.json
REGIONS_JSON_PATH =
# Fractions of all cases used for train / test. If they sum to < 1, only that subset of data is used.
TRAIN_FRACTION = 0.8
TEST_FRACTION = 0.2

[nnunet]
# nnU-Net's three subfolders, created inside TMP_WORKING_DIR
NNUNET_RAW_DIR = nnUNet_raw
NNUNET_RESULTS_DIR = nnUNet_results
NNUNET_PREPROCESSED_DIR = nnUNet_preprocessed

# 3d_fullres, 3d_lowres or 2d (3d_cascade_fullres not supported)
NNUNET_UNET_CONFIGURATION = 3d_fullres
# NNUNET_FOLD is a list of ints; [0, 1, 2, 3, 4] for 5-fold CV
NNUNET_FOLD = [0]

# NNUNET_TRAINER
# Default: nnUNetTrainer (1000 epochs)
# With no mirroring: nnUNetTrainerNoMirroring (1000 epochs)
# Quick training: nnUNetTrainer_1epoch, nnUNetTrainer_20epochs, etc.
# All options -> https://github.com/MIC-DKFZ/nnUNet/tree/master/nnunetv2/training/nnUNetTrainer/variants,
# open the folders and look at existing classes
NNUNET_TRAINER = nnUNetTrainerNoMirroring

# Experiment planner. Legacy = ExperimentPlanner, ResEnc = nnUNetPlannerResEnc{M,L,XL}
# See https://github.com/MIC-DKFZ/nnUNet/blob/master/documentation/resenc_presets.md for recommendations
NNUNET_PLANNER = ExperimentPlanner

# Plans identifier passed to nnU-Net's -p flag. Must match the name the chosen NNUNET_PLANNER writes:
# ExperimentPlanner -> nnUNetPlans; a ResEnc planner -> nnUNetResEncUNetPlans (adjust to match).
NNUNET_PLANS_IDENTIFIER = nnUNetPlans

# cuda = GPU, cpu = CPU. Apple silicon (mps) is not supported.
NNUNET_DEVICE = cuda

# Target GPU memory in GB for nnU-Net (controls batch / patch size). Leave blank for default.
# Always leave blank on first experiment(s) (see https://github.com/MIC-DKFZ/nnUNet/blob/master/nnunetv2/experiment_planning/plan_and_preprocess_entrypoints.py)
NNUNET_GPU_MEMORY_TARGET =

# Set True for npz export for best-config search and postprocessing.
NNUNET_NPZ = True

# Cap on nnU-Net's data loading + augmentation worker processes (leave blank for nnU-Net's default of 12).
# Only lower it on memory-constrained hosts.
NNUNET_N_PROC_DA =
