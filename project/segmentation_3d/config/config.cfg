[server]
MLFLOW_S3_ENDPOINT_URL = http://<remote server address>:8002
MLFLOW_TRACKING_URI = http://<remote server address>:85
ARTIFACT_PATH = s3://mlflow

[system]
CUDA_VISIBLE_DEVICES = 0 # Used only when NNUNET_DEVICE = cuda
RANDOM_SEED = 42
MAX_WORKERS = 32 # max workers for parallel XNAT data fetching

[xnat]
SERVER = http://<remote XNAT server address>:80
USER =
PASSWORD =
PROJECT =
VERIFY = false

[project]
NAME =

[data]
# Path to the regions.json describing the image + contour files to train on.
REGIONS_JSON_PATH = # e.g. regions/PROJECT/regions.json
TRAIN_FRACTION = 0.8
TEST_FRACTION = 0.2

[tmp_dirs]
OS_TMP_DIR = /tmp
TMP_WORKING_DIR = nnunet_tmp

[nnunet]
NNUNET_RAW_DIR = nnUNet_raw
NNUNET_RESULTS_DIR = nnUNet_results
NNUNET_PREPROCESSED_DIR = nnUNet_preprocessed

NNUNET_UNET_CONFIGURATION = 3d_fullres # 3d_fullres, 3d_lowres or 2d (3d_cascade_fullres not supported)
NNUNET_FOLD = [0] # list of ints; [0, 1, 2, 3, 4] for 5-fold CV

# NNUNET_TRAINER
# Default: nnUNetTrainer (1000 epochs)
# With no mirroring: nnUNetTrainerNoMirroring (1000 epochs)
# Quick training: nnUNetTrainer_1epoch, nnUNetTrainer_20epochs, etc.
# All options -> https://github.com/MIC-DKFZ/nnUNet/tree/master/nnunetv2/training/nnUNetTrainer/variants 
NNUNET_TRAINER = nnUNetTrainerNoMirroring

# Experiment planner. Legacy = ExperimentPlanner, ResEnc = nnUNetPlannerResEnc{M,L,XL}
NNUNET_PLANNER = ExperimentPlanner

# Plans identifier passed to nnU-Net's -p flag. Must match the name the chosen NNUNET_PLANNER writes:
# ExperimentPlanner -> nnUNetPlans; a ResEnc planner -> nnUNetResEncUNetPlans (adjust to match).
NNUNET_PLANS_IDENTIFIER = nnUNetPlans

NNUNET_DEVICE = cuda # mps = Apple M1/M2, cuda = GPU, cpu = CPU

# Target GPU memory in GB for nnU-Net (controls batch / patch size). Leave blank for default.
# Always leave blank on first experiment(s) (see https://github.com/MIC-DKFZ/nnUNet/blob/master/nnunetv2/experiment_planning/plan_and_preprocess_entrypoints.py)
NNUNET_GPU_MEMORY_TARGET =

NNUNET_NPZ = True # Set True for npz export for best-config search and postprocessing.
